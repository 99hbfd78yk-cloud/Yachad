<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח פעילות</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="לוח פעילות">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B6E5F">
<style>
html,body{margin:0;min-height:100%;background:#0B6E5F;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
.box{max-width:340px}
img{width:96px;height:96px;border-radius:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 12px}
p{font-size:16px;line-height:1.5;margin:8px 0}
a.btn{display:block;margin:20px 0 12px;padding:14px;border-radius:12px;background:#fff;color:#0B6E5F;font-weight:bold;font-size:18px;text-decoration:none}
.hint{background:rgba(255,255,255,.14);border-radius:12px;padding:12px;font-size:15px}
</style>
</head>
<body>
<div class="box">
<img src="apple-touch-icon.png" alt="">
<h1>לוח פעילות שבועי</h1>
<a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbzCUiuq-UOI3A7BjGFiJmYDOuRp-hA0x927z90yHnghk6tRRScxyCCe3hIhbfVqkWimzA/exec">פתיחת הלוח</a>
<div class="hint" id="hint">
<p><b>להוספה למסך הבית:</b></p>
<p>לוחצים על כפתור השיתוף ובוחרים "הוסף למסך הבית". לא להיכנס ללוח לפני כן.</p>
</div>
</div>
<script>
var s=false;
try{s=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches}catch(e){}
if(s){location.replace(document.getElementById('go').href)}
</script>
</body>
</html>
